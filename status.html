<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status | Y Network</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23e07a5f%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial, sans-serif%22 font-weight=%22bold%22 font-size=%2260%22>Y</text></svg>">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Public+Sans:wght@300;400;600;800&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8f9fa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #e07a5f;
            --accent-soft: #fdf2ee;
            --border: #e0e0e0;
            --status-up: #2ecc71;
            --status-down: #e74c3c;
            --status-warn: #f1c40f;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d0d0d;
                --surface: #151515;
                --text-main: #eeeeee;
                --text-muted: #a0a0a0;
                --accent: #e07a5f;
                --accent-soft: #2a1c1a;
                --border: #262626;
                --status-up: #27ae60;
                --status-down: #c0392b;
                --status-warn: #d4ac0d;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0d0d0d;
            --surface: #151515;
            --text-main: #eeeeee;
            --text-muted: #a0a0a0;
            --accent: #e07a5f;
            --accent-soft: #2a1c1a;
            --border: #262626;
            --status-up: #27ae60;
            --status-down: #c0392b;
            --status-warn: #d4ac0d;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        .accent-text { color: var(--accent); }
        .surface-bg { background-color: var(--surface); }
        .border-color { border-color: var(--border); }
        .text-muted { color: var(--text-muted); }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .up { background-color: var(--status-up); box-shadow: 0 0 6px var(--status-up); }
        .down { background-color: var(--status-down); box-shadow: 0 0 6px var(--status-down); }
        .warn { background-color: var(--status-warn); box-shadow: 0 0 6px var(--status-warn); }
    </style>
</head>
<body class="pb-24">
    <!-- Header -->
    <header class="max-w-4xl mx-auto px-6 py-8 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-xl font-bold tracking-tight">Y<span class="accent-text">status</span></span>
        </div>
        <div class="hidden md:flex items-center gap-6">
            <span class="text-sm font-medium text-muted mono">Network Mediator Status</span>
        </div>
    </header>

    <!-- Mobile Bottom Nav -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-bg border-t border-color px-6 py-3 flex justify-around items-center">
        <a href="index.html" class="flex flex-col items-center gap-1 text-muted hover:text-accent transition-colors">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <a href="status.html" class="flex flex-col items-center gap-1 accent-text">
            <i data-lucide="activity" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold uppercase">Status</span>
        </a>
        <a href="docs.html" class="flex flex-col items-center gap-1 text-muted hover:text-accent transition-colors">
            <i data-lucide="book-open" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold uppercase">Docs</span>
        </a>
    </div>

    <main class="max-w-3xl mx-auto px-6 py-4 md:py-12">
        <!-- Page Intro -->
        <div class="mb-10 text-center md:text-left">
            <h1 class="text-2xl md:text-3xl font-extrabold mb-3 tracking-tight">Network Health</h1>
            <p class="text-muted mb-6 max-w-xl mx-auto md:mx-0">Real-time health of the global seed nodes facilitating peer discovery across the Y network.</p>
            <div class="flex justify-center md:justify-start">
                <a href="docs.html" class="inline-flex items-center gap-2 text-xs font-medium text-muted hover:text-accent transition-colors border border-color px-3 py-1 rounded-full">
                    Detailed insights in docs <i data-lucide="external-link" class="w-3 h-3"></i>
                </a>
            </div>
        </div>

        <!-- Status Table -->
        <div class="surface-bg border border-color rounded-2xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-color bg-black/5 dark:bg-white/5 text-[11px] uppercase tracking-widest text-muted mono">
                            <th class="px-6 py-4 font-bold">Mediator Node</th>
                            <th class="px-6 py-4 font-bold">Location</th>
                            <th class="px-6 py-4 font-bold text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody id="status-body">
                        <!-- Data injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Legend -->
        <div class="mt-8 flex flex-wrap justify-center md:justify-start gap-6 text-xs mono text-muted">
            <div class="flex items-center"><span class="status-indicator up"></span> Operational</div>
            <div class="flex items-center"><span class="status-indicator warn"></span> Degraded</div>
            <div class="flex items-center"><span class="status-indicator down"></span> Offline</div>
        </div>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Data for a single seed node
        const mediators = [
            { id: 'mediator-1', name: 'Seed-01', location: 'US-East (Virginia)', status: 'down' },
        ];

        const body = document.getElementById('status-body');

        mediators.forEach(m => {
            const row = document.createElement('tr');
            row.className = 'border-b border-color last:border-0 hover:bg-black/5 dark:hover:bg-white/5 transition-colors';

            const statusClass = m.status;
            const statusText = m.status === 'up' ? 'Operational' : m.status === 'warn' ? 'Degraded' : 'Offline';
            const badgeClass = m.status === 'up' ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' : m.status === 'warn' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400' : 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400';

            row.innerHTML = `
                <td class="px-6 py-3">
                    <div class="font-bold text-sm">${m.name}</div>
                </td>
                <td class="px-6 py-3 text-sm text-muted">${m.location}</td>
                <td class="px-6 py-3 text-right">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold ${badgeClass}">
                        <span class="status-indicator ${statusClass}"></span>
                        ${statusText}
                    </span>
                </td>
            `;
            body.appendChild(row);
        });
    </script>
</body>
</html>
