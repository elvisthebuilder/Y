<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status | Y Network</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23e07a5f%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial, sans-serif%22 font-weight=%22bold%22 font-size=%2260%22>Y</text></svg>">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Public+Sans:wght@300;400;600;800&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8f9fa;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #e07a5f;
            --accent-soft: #fdf2ee;
            --border: #e0e0e0;
            --status-up: #2ecc71;
            --status-down: #e74c3c;
            --status-warn: #f1c40f;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d0d0d;
                --surface: #151515;
                --text-main: #eeeeee;
                --text-muted: #a0a0a0;
                --accent: #e07a5f;
                --accent-soft: #2a1c1a;
                --border: #262626;
                --status-up: #27ae60;
                --status-down: #c0392b;
                --status-warn: #d4ac0d;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0d0d0d;
            --surface: #151515;
            --text-main: #eeeeee;
            --text-muted: #a0a0a0;
            --accent: #e07a5f;
            --accent-soft: #2a1c1a;
            --border: #262626;
            --status-up: #27ae60;
            --status-down: #c0392b;
            --status-warn: #d4ac0d;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        .accent-text { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        .surface-bg { background-color: var(--surface); }
        .border-color { border-color: var(--border); }
        .text-muted { color: var(--text-muted); }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .up { background-color: var(--status-up); box-shadow: 0 0 8px var(--status-up); }
        .down { background-color: var(--status-down); box-shadow: 0 0 8px var(--status-down); }
        .warn { background-color: var(--status-warn); box-shadow: 0 0 8px var(--status-warn); }

        /* Collapsible card smooth transition */
        #insight-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 0;
        }
        #insight-content:not(.hidden) {
            max-height: 500px; /* Sufficient for content */
            opacity: 1;
        }
    </style>
</head>
<body>
    <nav class="max-w-4xl mx-auto px-6 py-8 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-xl font-bold tracking-tight">Y<span class="accent-text">status</span></span>
        </div>
        <div class="flex items-center gap-6">
            <a href="index.html" class="group flex items-center gap-2 text-sm font-semibold transition-all duration-200 hover:text-accent">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-200 group-hover:-translate-x-1">
                    <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="docs.html" class="text-sm font-semibold hover:text-accent transition-colors">Documentation</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12">
        <div class="mb-12">
            <h1 class="text-3xl font-extrabold mb-4">Network Mediator Status</h1>
            <p class="text-muted mb-6">Real-time health of the global seed nodes facilitating peer discovery.</p>

            <div class="bg-accent-soft-bg rounded-xl border border-accent/20 overflow-hidden">
                <button id="insight-toggle" class="w-full flex justify-between items-center p-4 text-left focus:outline-none group">
                    <span class="font-bold accent-text flex items-center gap-2">
                        <i data-lucide="lightbulb"></i> Network Insights
                    </span>
                    <a href="docs.html" class="text-xs font-bold uppercase tracking-widest accent-text hover:underline flex items-center gap-1 transition-all duration-200">
                        Read Full Docs
                        <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                </button>
                <div class="p-4 text-sm text-muted leading-relaxed italic">
                    Detailed network insights and mediator guides have been moved to the <a href="docs.html" class="accent-text font-semibold hover:underline">Documentation page</a>.
                </div>
            </div>
        </div>

        <div class="surface-bg border border-color rounded-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-color text-xs uppercase tracking-widest text-muted mono">
                        <th class="px-6 py-4 font-semibold">Mediator Node</th>
                        <th class="px-6 py-4 font-semibold">Location</th>
                        <th class="px-6 py-4 font-semibold text-right">Status</th>
                    </tr>
                </thead>
                <tbody id="status-body">
                    <!-- Data injected by JS -->
                </tbody>
            </table>
        </div>

        <div class="mt-8 flex items-center gap-4 text-xs mono text-muted">
            <div class="flex items-center"><span class="status-indicator up"></span> Operational</div>
            <div class="flex items-center"><span class="status-indicator warn"></span> Degraded</div>
            <div class="flex items-center"><span class="status-indicator down"></span> Offline</div>
        </div>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Mock data for now - this would typically be fetched from a health-check API
        const mediators = [
            { id: 'mediator-1', name: 'Seed-01', location: 'US-East (Virginia)', status: 'down', ip: '13.63.20.28' },
        ];

        const body = document.getElementById('status-body');

        // Toggle Insight Card
        const toggleBtn = document.getElementById('insight-toggle');
        const content = document.getElementById('insight-content');
        const chevron = document.getElementById('chevron');

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isHidden = content.classList.toggle('hidden');

            chevron.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        mediators.forEach(m => {
            const row = document.createElement('tr');
            row.className = 'border-b border-color last:border-0 hover:bg-black/5 transition-colors';

            const statusClass = m.status;
            const statusText = m.status === 'up' ? 'Operational' : m.status === 'warn' ? 'Degraded' : 'Offline';

            row.innerHTML = `
                <td class="px-6 py-4">
                    <div class="font-bold">${m.name}</div>
                </td>
                <td class="px-6 py-4 text-sm text-muted">${m.location}</td>
                <td class="px-6 py-4 text-right">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${m.status === 'up' ? 'bg-green-100 text-green-800' : m.status === 'warn' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'} dark:bg-opacity-20 dark:text-main">
                        <span class="status-indicator ${statusClass}"></span>
                        ${statusText}
                    </span>
                </td>
            `;
            body.appendChild(row);
        });
    </script>
</body>
</html>
