name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (e.g. v0.1.0)'
        required: true
      os:
        description: 'Which platform to build'
        required: true
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

  build-linux:
    name: Build Linux (.deb + binaries)
    needs: quality-gate
    if: ${{ !inputs.os || inputs.os == 'all' || inputs.os == 'linux' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            deb: true
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            deb: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set cross-compilation env
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "AR=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build .deb package
        if: ${{ matrix.deb }}
        run: |
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }} --no-build

      - name: Package and Upload
        run: |
          mkdir -p $GITHUB_WORKSPACE/release_artifacts
          if [ "${{ matrix.deb }}" = "true" ]; then
            cp target/debian/*.deb $GITHUB_WORKSPACE/release_artifacts/
          fi
          cd target/${{ matrix.target }}/release
          tar czf $GITHUB_WORKSPACE/release_artifacts/y-linux-${{ matrix.arch }}.tar.gz y

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: release_artifacts/


  build-macos:
    name: Build macOS (.dmg)
    needs: quality-gate
    if: ${{ !inputs.os || inputs.os == 'all' || inputs.os == 'macos' }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package and Upload
        run: |
          mkdir -p $GITHUB_WORKSPACE/release_artifacts
          cd target/${{ matrix.target }}/release
          tar czf $GITHUB_WORKSPACE/release_artifacts/y-macos-${{ matrix.arch }}.tar.gz y
          if [ -f "$GITHUB_WORKSPACE/y-macos-${{ matrix.arch }}.dmg" ]; then
            cp "$GITHUB_WORKSPACE/y-macos-${{ matrix.arch }}.dmg" $GITHUB_WORKSPACE/release_artifacts/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: release_artifacts/

  build-windows:
    name: Build Windows (.msi + .exe)
    needs: quality-gate
    if: ${{ !inputs.os || inputs.os == 'all' || inputs.os == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Init WiX
        run: cargo wix init --force

      - name: Build .msi installer
        run: cargo wix --no-build --nocapture

      - name: Package and Upload
        run: |
          mkdir -p $GITHUB_WORKSPACE/release_artifacts
          cp target/release/y.exe $GITHUB_WORKSPACE/release_artifacts/
          if [ -d "target/wix" ]; then
            cp target/wix/*.msi $GITHUB_WORKSPACE/release_artifacts/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: release_artifacts/

  release:
    name: Upload to Release
    needs: [build-linux, build-macos, build-windows]
    if: always() && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug - List all files in artifacts
        run: find artifacts -type f

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe